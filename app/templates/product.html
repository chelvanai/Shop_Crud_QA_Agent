<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product</title>
    <link rel="stylesheet" href="../static/css/home_style.css">
    <link rel="stylesheet" href="../static/css/product_style.css">
</head>
<body>
<div class="sidebar">
    <a href="customer" class="nav-btn">Customer</a>
    <a href="product" class="nav-btn">Product</a>
    <a href="invoice" class="nav-btn">Invoice</a>
    <a href="analytics" class="nav-btn">Analytics</a>
</div>
<div class="main-content">

    <button id="add-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="lucide lucide-package-plus-icon lucide-package-plus">
            <path d="M16 16h6"/>
            <path d="M19 13v6"/>
            <path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14"/>
            <path d="m7.5 4.27 9 5.15"/>
            <polyline points="3.29 7 12 12 20.71 7"/>
            <line x1="12" x2="12" y1="22" y2="12"/>
        </svg>
        Add
    </button>

    <table id="dataTable">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Unit</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <!-- Dynamic rows go here -->
        </tbody>
    </table>
</div>
<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close-btn" id="closeModal">&times;</span>
        <h2>Add New User</h2>
        <form id="addForm">
            <label>
                Name:<br>
                <input type="text" id="nameInput" required>
            </label><br><br>
            <label>
                Price:<br>
                <input type="text" id="priceInput" required>
            </label><br><br>
            <label>
                Unit:<br>
                <input type="text" id="unitInput" required>
            </label><br><br>
            <button type="submit">Submit</button>
        </form>
    </div>
</div>
<script src="../static/js/product_page.js"></script>
</body>
</html>
